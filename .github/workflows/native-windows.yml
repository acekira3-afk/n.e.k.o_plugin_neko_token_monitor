name: Build Windows widget
on:
  workflow_dispatch:
  push:
    paths: ['native/windows/**', '.github/workflows/native-windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build native/windows/CatFood.csproj -c Release -o out
      - run: python native/windows/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-widget
          path: out/
