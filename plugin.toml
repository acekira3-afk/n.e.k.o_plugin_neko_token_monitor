[plugin]
id = "neko_token_monitor"
name = "猫粮"
description = "启动即显示透明桌面猫娘和余额思考气泡：点击吐槽、摸头、拖动、低余额提醒；支持 DeepSeek、OpenAI/GPT、Claude、自定义接口和手动预算；窗口内设置账户，macOS 与 Windows 桌面挂件。"
short_description = "YUI companion with configurable balance sources and explicitly estimated budgets."
version = "0.7.0"
entry = "plugin.plugins.neko_token_monitor:NekoTokenMonitorPlugin"

[plugin.author]
name = "acekira3-afk"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
