<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猫粮</title><link rel="stylesheet" href="/widget.css">
<div id="recordBar"><button id="historyToggle" type="button">互动记录</button><span id="recordCounts" role="status">读取记录中…</span></div><section id="historyPanel" hidden><header><h2>互动记录</h2><button id="closeHistory">返回</button></header><p id="historyTotals"></p><p id="memoryStatus"></p><p>Agent 与数据状态只保存在本机记录中。</p><button id="historyRetry">重试写入 YUI 记忆</button><div id="historyRows"></div></section><div id="pet">
<button id="thought" aria-label="切换猫粮余额和空闲时间"><div id="readout"><div class="title" id="heading">猫粮余额</div><div id="amount">未连接</div><div id="detail">点击 ≡ 设置账户</div></div><div id="quip" hidden></div></button>
<i class="dot one"></i><i class="dot two"></i>
<button id="menuToggle" aria-label="打开挂件菜单">≡</button>

</div><div id="menu" hidden><button id="exitRecord" type="button">和猫娘一起玩</button><button id="balanceMode">显示余额</button><button id="tokenMode">显示估算 token</button><button id="refreshNow">刷新数据</button><button id="yuiReply">让原版 YUI 回应</button><button id="settings">模型额度总览</button><button id="musicOpen">节奏演奏器</button><button id="retryMemory">重试保存记忆</button></div><section id="musicPanel" aria-label="猫粮节奏演奏器" hidden><header><strong>节奏音乐</strong><button id="musicClose" aria-label="关闭演奏器">×</button></header><div class="musicControls"><button id="musicPlay">试听</button><button id="musicStop">停止</button><button id="musicSettingsOpen" aria-label="演奏设置">设置</button></div><p id="musicStatus" role="status">跟着节奏点 YUI 喵～</p></section><section id="musicSettingsPanel" aria-label="演奏设置" hidden><header><strong>演奏设置 · 喵～</strong><button id="musicSettingsClose" aria-label="关闭演奏设置">×</button></header><label for="musicPitch">音高 <output id="musicPitchValue">原音高</output></label><input id="musicPitch" type="range" min="-12" max="12" step="1" value="0" aria-label="演奏音高"><label for="musicVolume">音量</label><input id="musicVolume" type="range" min="0" max="1" step="0.05" aria-label="演奏音量"><label><input id="musicLoop" type="checkbox">循环试听</label><p>关闭设置后，按自己的节奏点 YUI 就能接着奏喵～</p></section><section id="accountPanel" hidden></section><link rel="stylesheet" href="/settings.css"><script src="/settings.js"></script><script src="/widget.js"></script><script src="/music.js"></script></html>
